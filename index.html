<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory</title>
  <link rel="preload" href="/assets/stadia_controller_background.svg" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Red+Rose:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ── 1. Hero ── -->
  <section class="hero" id="hero">
    <div class="hero__content">
      <p class="hero__subtitle">It's play time.</p>
      <h1 class="hero__title">Ready to play?</h1>

      <button class="hero__btn" id="play-btn">
        <img src="/assets/stadia_controller.svg" alt="controller">
        <span>Play</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </div>

    <img src="/assets/stadia_controller_background.svg" alt="" class="hero__bg-icon" aria-hidden="true">
  </section>

  <!-- ── 2. Settings ── -->
  <section class="settings" id="settings" style="display: none;">
    <div class="settings__header">
      <h1 class="settings__title">Settings</h1>
      <div class="settings__underline"></div>
    </div>

    <div class="settings__layout">

      <!-- LEFT: Options -->
      <div class="settings__options">

        <section class="settings__section">
          <h2 class="settings__section-title">
            <img src="/assets/palette.png" alt="" class="settings__section-icon" aria-hidden="true">
            Game themes
          </h2>
          
          <div class="settings__radio-group">
            <label class="settings__radio-option">
              <input type="radio" name="theme" value="code" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">Code vibes theme</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
            <label class="settings__radio-option">
              <input type="radio" name="theme" value="gaming" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">Gaming theme</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
          </div>
        </section>

        <section class="settings__section">
          <h2 class="settings__section-title">
            <img src="/assets/chess_pawn.png" alt="" class="settings__section-icon" aria-hidden="true">
            Choose player
          </h2>
          <div class="settings__radio-group">
            <label class="settings__radio-option">
              <input type="radio" name="player" value="blue" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">Blue</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
            <label class="settings__radio-option">
              <input type="radio" name="player" value="orange" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">Orange</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
          </div>
        </section>

        <section class="settings__section">
          <h2 class="settings__section-title">
            <img src="/assets/style.png" alt="" class="settings__section-icon" aria-hidden="true">
            Board size
          </h2>
          <div class="settings__radio-group">
            <label class="settings__radio-option">
              <input type="radio" name="size" value="16" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">16 cards</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
            <label class="settings__radio-option">
              <input type="radio" name="size" value="24" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">24 cards</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
            <label class="settings__radio-option">
              <input type="radio" name="size" value="36" />
              <span class="settings__radio-circle"></span>
              <span class="settings__radio-label">36 cards</span>
              <img src="/assets/selected_option.png" alt="" class="settings__selected-icon" aria-hidden="true">
            </label>
          </div>
        </section>

      </div>

 <!-- RIGHT: Preview -->
<div class="settings__preview-wrap">

  <img
    src="/assets/themes/preview_code.svg"
    alt="Theme preview"
    class="settings__preview-img"
    id="preview-img"
  >

      <!-- Bottom bar -->
  <div class="settings__bottom-bar">
    <span class="settings__bar-item" id="bar-theme">Game theme</span>
    <img src="/assets/line.png" alt="" class="settings__bar-line" id="bar-line-1" style="display: none;">
    <span class="settings__bar-item" id="bar-player">Player</span>
    <img src="/assets/line.png" alt="" class="settings__bar-line" id="bar-line-2" style="display: none;">
    <span class="settings__bar-item" id="bar-size">Board size</span>
    <button class="settings__start-btn" id="start-btn" type="button" disabled style="display:none;">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      Start
    </button>
    <img src="/assets/btn_disabled.png" alt="Disabled play button" class="settings__start-img settings__start-img--disabled" id="btn-disabled">
    <img src="/assets/btn_play.png" alt="Play button" class="settings__start-img settings__start-img--play" id="btn-play" style="display:none;">
  </div>

</div>
  </section>

  <!-- ── 3. Game ── -->
  <section class="game" id="game" style="display: none;">

    <!-- HUD -->
    <header class="game__hud">
      <div class="game__hud-scores">
        <div class="game__hud-player game__hud-player--blue" id="hud-player-blue">
          <img src="/assets/player_blue.png" alt="Blue player" class="game__hud-icon" id="hud-icon-blue">
          <span class="game__hud-name">Blue</span>
          <span class="game__hud-score" id="score-blue">0</span>
        </div>
        <div class="game__hud-player game__hud-player--orange" id="hud-player-orange">
          <img src="/assets/player_orange.png" alt="Orange player" class="game__hud-icon" id="hud-icon-orange">
          <span class="game__hud-name">Orange</span>
          <span class="game__hud-score" id="score-orange">0</span>
        </div>
      </div>

      <div class="game__hud-current">
        Current player:
        <img src="/assets/player_blue_code.png" alt="Current player" class="game__hud-current-icon" id="current-player-icon">
        <span class="game__hud-current-label" id="current-player-label"></span>
      </div>

      <button class="game__exit-btn" id="exit-game-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Exit game
      </button>
    </header>

    <!-- Board -->
    <main class="game__board-wrap">
      <div class="game__board" id="game-board"></div>
    </main>

    <!-- Game End Overlay -->
    <div class="game__end-overlay" id="game-end-overlay" style="display: none;">
      <div class="game__end-card">
        <p class="game__end-message" id="game-end-message">Blue wins! 🎉</p>
        <div class="game__end-actions">
          <button class="game__end-btn game__end-btn--primary" id="game-end-play-again">Play again</button>
          <button class="game__end-btn game__end-btn--secondary" id="game-end-home">Home</button>
        </div>
      </div>
    </div>

    <!-- Exit Game Overlay -->
    <div class="game__exit-overlay" id="game-exit-overlay" style="display: none;">
      <div class="game__exit-card">
        <p class="game__exit-message">Are you sure you want to quit the game?</p>
        <div class="game__exit-actions">
          <button class="game__exit-btn game__exit-btn--primary" id="game-exit-back">No, back to game</button>
          <button class="game__exit-btn game__exit-btn--secondary" id="game-exit-confirm">Yes, quit game</button>
        </div>
      </div>
    </div>

  </section>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
